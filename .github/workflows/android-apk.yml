name: Build Mistir Gift Android Demo APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'mistir-ui.css'
      - 'mistir-ui.js'
      - 'mistir-catalog.js'
      - 'mistir-swipe.js'
      - 'mistir-wishlist.js'
      - 'mistir-wishlist.css'
      - 'wishlist.html'
      - 'vd-base.css'
      - 'mistir-motion.js'
      - 'mistir-download.js'
      - 'vendor/**'
      - 'android-download.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify demo JavaScript
        run: node tests/smoke.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check animation module syntax
        run: node --check --input-type=module < mistir-motion.js

      - name: Validate wishlist JavaScript syntax
        run: |
          node --check mistir-catalog.js
          node --check mistir-wishlist.js
          node --check mistir-swipe.js

      - name: Bundle the existing store demo
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html mistir-ui.css mistir-ui.js mistir-motion.js mistir-download.js mistir-catalog.js mistir-swipe.js mistir-wishlist.js mistir-wishlist.css wishlist.html vd-base.css android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/vendor
          cp vendor/anime.esm.min.js android/app/src/main/assets/vendor/
          cp vendor/ANIMEJS-LICENSE.md android/app/src/main/assets/vendor/
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/assets/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('href="/mistir-ui.css"', 'href="mistir-ui.css"')
          html = html.replace('src="/mistir-ui.js"', 'src="mistir-ui.js"')
          html = html.replace('href="/mistir-ui.css"', 'href="mistir-ui.css"')
          html = html.replace('src="/mistir-motion.js"', 'src="mistir-motion.js"')
          html = html.replace('src="/mistir-download.js"', 'src="mistir-download.js"')
          html = html.replace("let u=new URL(location.href)", "let u=new URL('https://mistir-gift-demo-vedoy.vercel.app/')")
          path.write_text(html, encoding='utf-8')
          PY

      - name: Compile APK without Android Studio
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Prepare named APK and checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MistirGift-VedoyStudio-demo.apk
          sha256sum MistirGift-VedoyStudio-demo.apk > MistirGift-VedoyStudio-demo.apk.sha256

      - name: Create ZIP containing installable APK and guide
        run: |
          cat > LES-MEG-INSTALLASJON.txt <<'EOF'
          MISTIR GIFT DEMO - ANDROID (Vedoy Studio)

          1. Pakk ut denne ZIP-filen pa Android-telefonen.
          2. Trykk pa MistirGift-VedoyStudio-demo.apk.
          3. Godkjenn installasjon fra denne filappen hvis Android ber om det.
          4. Apne Mistir Gift Demo.

          Dette er en konseptdemo uten ekte betalinger eller bestillinger.
          APK-en er signert med GitHub Actions sin midlertidige debug-nokkel.
          Ved oppdatering kan en tidligere installert demo matte avinstalleres.
          EOF
          zip -j MistirGift-VedoyStudio-demo.zip MistirGift-VedoyStudio-demo.apk MistirGift-VedoyStudio-demo.apk.sha256 LES-MEG-INSTALLASJON.txt
          unzip -t MistirGift-VedoyStudio-demo.zip

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MistirGift-Android-Demo-APK
          path: |
            MistirGift-VedoyStudio-demo.apk
            MistirGift-VedoyStudio-demo.apk.sha256
            MistirGift-VedoyStudio-demo.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view apk-demo-latest >/dev/null 2>&1; then
            gh release create apk-demo-latest --title "Mistir Gift Android demo (Vedoy Studio)" --target main --prerelease --notes "Concept demo only. No live payments or orders. Built by GitHub Actions from the public source. Debug signed and intended for testing."
          fi
          gh release upload apk-demo-latest MistirGift-VedoyStudio-demo.apk MistirGift-VedoyStudio-demo.apk.sha256 MistirGift-VedoyStudio-demo.zip --clobber
