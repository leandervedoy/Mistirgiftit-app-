plugins {
    id 'com.android.application'
}

android {
    namespace 'no.vedoy.mistirgift.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'no.vedoy.mistirgift.demo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
